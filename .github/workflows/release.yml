name: Build & Release Gens Horizon (Manuel)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom de la version (ex: v1.4.2)'
        required: true
        default: 'v1.4.2'

permissions:
  contents: write

concurrency:
  group: release-gens-horizon
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Validate Tag Name
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag invalide : $TAG_NAME" >&2
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -race -count=1 -v ./...

      - name: Install lipo (Universal Binary tool)
        run: go install github.com/konoui/lipo@v0.10.0

      - name: Compile Horizon Binaries (Cross-Platform)
        env:
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          D_CLIENT_ID: ${{ secrets.D_CLIENT_ID }}
          D_CLIENT_SECRET: ${{ secrets.D_CLIENT_SECRET }}
          O_CLIENT_ID: ${{ secrets.O_CLIENT_ID }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag invalide : $TAG_NAME" >&2
            exit 1
          fi
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/WilliamBossard/Gens-Horizon/config.GoogleClientID=${G_CLIENT_ID} -X github.com/WilliamBossard/Gens-Horizon/config.GoogleClientSecret=${G_CLIENT_SECRET} -X github.com/WilliamBossard/Gens-Horizon/config.DropboxClientID=${D_CLIENT_ID} -X github.com/WilliamBossard/Gens-Horizon/config.DropboxClientSecret=${D_CLIENT_SECRET} -X github.com/WilliamBossard/Gens-Horizon/config.OneDriveClientID=${O_CLIENT_ID} -X github.com/WilliamBossard/Gens-Horizon/config.AppVersion=${TAG_NAME}"

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon.exe .

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon-linux .

          # Linux arm64 (Raspberry Pi 5, Steam Deck, etc.)
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/Horizon-linux-arm64 .

          # macOS Universal Binary (x86_64 + ARM64 Apple Silicon)
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/Horizon-macos-arm64 .
          lipo -create -output dist/Horizon-macos dist/Horizon-macos-amd64 dist/Horizon-macos-arm64
          rm dist/Horizon-macos-amd64 dist/Horizon-macos-arm64

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum Horizon.exe | awk '{print $1}' > Horizon.exe.sha256
          sha256sum Horizon-linux | awk '{print $1}' > Horizon-linux.sha256
          sha256sum Horizon-linux-arm64 | awk '{print $1}' > Horizon-linux-arm64.sha256
          sha256sum Horizon-macos | awk '{print $1}' > Horizon-macos.sha256

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          draft: true
          files: |
            dist/Horizon.exe
            dist/Horizon.exe.sha256
            dist/Horizon-linux
            dist/Horizon-linux.sha256
            dist/Horizon-linux-arm64
            dist/Horizon-linux-arm64.sha256
            dist/Horizon-macos
            dist/Horizon-macos.sha256
