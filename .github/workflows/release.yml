name: Build & Release Gens Horizon (Manuel)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom de la version (ex: v1.4.2)'
        required: true
        default: 'v1.4.2'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

      - name: Compile Horizon Binaries (Cross-Platform)
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X 'github.com/WilliamBossard/Gens-Horizon/config.GoogleClientID=${{ secrets.G_CLIENT_ID }}' \
                         -X 'github.com/WilliamBossard/Gens-Horizon/config.GoogleClientSecret=${{ secrets.G_CLIENT_SECRET }}' \
                         -X 'github.com/WilliamBossard/Gens-Horizon/config.DropboxClientID=${{ secrets.D_CLIENT_ID }}' \
                         -X 'github.com/WilliamBossard/Gens-Horizon/config.DropboxClientSecret=${{ secrets.D_CLIENT_SECRET }}' \
                         -X 'github.com/WilliamBossard/Gens-Horizon/config.OneDriveClientID=${{ secrets.O_CLIENT_ID }}' \
                         -X 'github.com/WilliamBossard/Gens-Horizon/config.AppVersion=${{ github.event.inputs.tag_name }}'"

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon.exe .

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon-linux .

          # Linux arm64 (Raspberry Pi 5, Steam Deck, etc.)
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/Horizon-linux-arm64 .

          # macOS Universal Binary (x86_64 + ARM64 Apple Silicon)
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/Horizon-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/Horizon-macos-arm64 .
          llvm-lipo -create -output dist/Horizon-macos dist/Horizon-macos-amd64 dist/Horizon-macos-arm64
          rm dist/Horizon-macos-amd64 dist/Horizon-macos-arm64

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum Horizon.exe | awk '{print $1}' > Horizon.exe.sha256
          sha256sum Horizon-linux | awk '{print $1}' > Horizon-linux.sha256
          sha256sum Horizon-linux-arm64 | awk '{print $1}' > Horizon-linux-arm64.sha256
          sha256sum Horizon-macos | awk '{print $1}' > Horizon-macos.sha256

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          draft: true
          files: |
            dist/Horizon.exe
            dist/Horizon.exe.sha256
            dist/Horizon-linux
            dist/Horizon-linux.sha256
            dist/Horizon-linux-arm64
            dist/Horizon-linux-arm64.sha256
            dist/Horizon-macos
            dist/Horizon-macos.sha256
